
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon profil | MSK.WORK</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">MSK<span>.</span>WORK</div>
    <nav>
        <a href="index.html">Accueil</a>
        <a href="emploi.html">Emploi du temps</a>
        <a href="moyenne.html">Moyennes</a>
        <a href="calendrier.html">Calendrier</a>
        <a href="notes.html">Notes</a>
        <a href="profil.html">Profil</a>
    </nav>
</header>

<main style="padding: 40px; color: white; background: #222;">
    <h1>MON PROFIL</h1>
    <p>Bienvenue sur ton espace personnel MSK.WORK.</p>
    <p>Si tu vois ce texte, le contenu de la page fonctionne.</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>
const client = window.supabaseClient;

const avatarPreview = document.getElementById("avatarPreview");
const avatarInput = document.getElementById("avatarInput");
const profileForm = document.getElementById("profileForm");
const message = document.getElementById("profileMessage");

let currentUser = null;

function showMessage(text, error = false) {
    message.textContent = text;
    message.style.color = error ? "#e05252" : "#4caf50";
}

async function loadProfile() {
    const { data: authData, error: authError } =
        await client.auth.getUser();

    if (authError || !authData.user) {
        window.location.href = "connexion.html";
        return;
    }

    currentUser = authData.user;

    document.getElementById("email").value = currentUser.email || "";

    const { data: profile, error } = await client
        .from("profiles")
        .select("*")
        .eq("id", currentUser.id)
        .maybeSingle();

    if (error) {
        showMessage("Impossible de charger le profil.", true);
        return;
    }

    document.getElementById("username").value = profile?.username || "";
    document.getElementById("firstName").value = profile?.first_name || "";
    document.getElementById("lastName").value = profile?.last_name || "";

    if (profile?.avatar_url) {
        avatarPreview.src = profile.avatar_url;
    }
}

profileForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    if (!currentUser) return;

    const username = document.getElementById("username").value.trim();

    const { error } = await client
        .from("profiles")
        .upsert({
            id: currentUser.id,
            username: username || null,
            first_name: document.getElementById("firstName").value.trim(),
            last_name: document.getElementById("lastName").value.trim(),
            updated_at: new Date().toISOString()
        });

    if (error) {
        showMessage("Erreur : " + error.message, true);
    } else {
        showMessage("Profil enregistré !");
    }
});

avatarInput.addEventListener("change", async () => {
    const file = avatarInput.files[0];

    if (!file || !currentUser) return;

    if (!file.type.startsWith("image/")) {
        showMessage("Choisis une image valide.", true);
        return;
    }

    if (file.size > 2 * 1024 * 1024) {
        showMessage("L'image ne doit pas dépasser 2 Mo.", true);
        return;
    }

    const extension = file.name.split(".").pop().toLowerCase();
    const filePath = `${currentUser.id}/avatar.${extension}`;

    showMessage("Envoi de la photo...");

    const { error: uploadError } = await client.storage
        .from("avatars")
        .upload(filePath, file, { upsert: true });

    if (uploadError) {
        showMessage("Erreur : " + uploadError.message, true);
        return;
    }

    const { data: urlData } = client.storage
        .from("avatars")
        .getPublicUrl(filePath);

    const avatarUrl = urlData.publicUrl + "?t=" + Date.now();

    const { error: updateError } = await client
        .from("profiles")
        .upsert({
            id: currentUser.id,
            avatar_url: urlData.publicUrl,
            updated_at: new Date().toISOString()
        });

    if (updateError) {
        showMessage("Photo envoyée, mais profil non actualisé.", true);
        return;
    }

    avatarPreview.src = avatarUrl;
    showMessage("Photo de profil mise à jour !");
});

document.getElementById("logoutButton").addEventListener("click", async () => {
    const { error } = await client.auth.signOut();

    if (error) {
        showMessage("Erreur lors de la déconnexion.", true);
        return;
    }

    window.location.href = "connexion.html";
});

loadProfile();
</script>

</body>
</html>
