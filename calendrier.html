
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendrier | MSK.WORK</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">MSK<span>.</span>WORK</div>
    <nav>
        <a href="index.html">Accueil</a>
        <a href="emploi.html">Emploi du temps</a>
        <a href="moyenne.html">Mes moyennes</a>
        <a href="calendrier.html">Calendrier</a>
    </nav>
</header>

<main class="calendar-page">
    <h1>Mon <span>calendrier</span></h1>
    <p class="calendar-description">Organise tes journées et tes événements.</p>

    <section class="calendar-box">
        <div class="calendar-header">
            <button id="prev-month">‹</button>
            <h2 id="month-year"></h2>
            <button id="next-month">›</button>
        </div>

        <div class="calendar-weekdays">
            <div>Lun</div><div>Mar</div><div>Mer</div>
            <div>Jeu</div><div>Ven</div><div>Sam</div><div>Dim</div>
        </div>

        <div id="calendar-days" class="calendar-days"></div>
    </section>

    <section class="events-section">
        <h2>Mes événements</h2>
        <p id="selected-date">Sélectionne une date dans le calendrier.</p>
        <div id="events-list"></div>
    </section>
</main>

<!-- Fenêtre d'ajout d'événement -->
<div id="event-modal" class="event-modal">
    <div class="event-form">
        <button id="close-modal" class="close-modal">×</button>
        <h2>Nouvel événement</h2>
        <p id="event-date"></p>

        <form id="event-form">
            <label for="event-title">Titre</label>
            <input type="text" id="event-title" placeholder="Ex : Révision de maths" required>

            <label for="event-time">Heure</label>
            <input type="time" id="event-time">

            <label for="event-description">Description</label>
            <textarea id="event-description" placeholder="Quelques détails..."></textarea>

            <button type="submit" class="save-event">Enregistrer</button>
        </form>
    </div>
</div>

<script>
const monthYear = document.getElementById("month-year");
const calendarDays = document.getElementById("calendar-days");
const selectedDateText = document.getElementById("selected-date");
const modal = document.getElementById("event-modal");
const eventForm = document.getElementById("event-form");

let currentDate = new Date();
let selectedDate = null;
let events = JSON.parse(localStorage.getItem("msk-work-events") || "{}");

const today = new Date();
today.setHours(0, 0, 0, 0);

function dateKey(year, month, day) {
    return `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
}

function displayCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    monthYear.textContent = new Date(year, month).toLocaleDateString("fr-FR", {
        month: "long",
        year: "numeric"
    });

    calendarDays.innerHTML = "";

    const firstDay = new Date(year, month, 1).getDay();
    const offset = (firstDay + 6) % 7;
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < offset; i++) {
        const empty = document.createElement("div");
        empty.className = "empty-day";
        calendarDays.appendChild(empty);
    }

    for (let day = 1; day <= daysInMonth; day++) {
        const key = dateKey(year, month, day);
        const date = new Date(year, month, day);

        const cell = document.createElement("button");
        cell.className = "calendar-day";
        cell.textContent = day;

        if (date.getTime() === today.getTime()) {
            cell.classList.add("today");
        }

        if (events[key]?.length) {
            cell.classList.add("has-event");
        }

        if (selectedDate === key) {
            cell.classList.add("selected");
        }

        cell.addEventListener("click", () => {
            selectedDate = key;
            displayCalendar();
            displayEvents();
            openModal();
        });

        calendarDays.appendChild(cell);
    }
}

function openModal() {
    const [year, month, day] = selectedDate.split("-").map(Number);
    const date = new Date(year, month - 1, day);

    document.getElementById("event-date").textContent =
        date.toLocaleDateString("fr-FR", {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
        });

    eventForm.reset();
    modal.classList.add("active");
    document.getElementById("event-title").focus();
}

function closeModal() {
    modal.classList.remove("active");
}

function displayEvents() {
    if (!selectedDate) return;

    const [year, month, day] = selectedDate.split("-").map(Number);
    const date = new Date(year, month - 1, day);

    selectedDateText.textContent = date.toLocaleDateString("fr-FR", {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
    });

    const list = document.getElementById("events-list");
    list.innerHTML = "";

    const dayEvents = events[selectedDate] || [];

    if (dayEvents.length === 0) {
        list.textContent = "Aucun événement pour cette date.";
        return;
    }

    dayEvents.forEach((event, index) => {
        const item = document.createElement("div");
        item.className = "event-item";

        const title = document.createElement("h3");
        title.textContent = event.title;

        const details = document.createElement("p");
        details.textContent = [
            event.time || "",
            event.description || ""
        ].filter(Boolean).join(" — ");

        const remove = document.createElement("button");
        remove.textContent = "Supprimer";
        remove.addEventListener("click", () => {
            events[selectedDate].splice(index, 1);
            if (events[selectedDate].length === 0) {
                delete events[selectedDate];
            }
            saveEvents();
        });

        item.append(title, details, remove);
        list.appendChild(item);
    });
}

function saveEvents() {
    localStorage.setItem("msk-work-events", JSON.stringify(events));
    displayCalendar();
    displayEvents();
}

eventForm.addEventListener("submit", (e) => {
    e.preventDefault();

    const title = document.getElementById("event-title").value.trim();
    const time = document.getElementById("event-time").value;
    const description = document.getElementById("event-description").value.trim();

    if (!title) return;

    if (!events[selectedDate]) events[selectedDate] = [];

    events[selectedDate].push({ title, time, description });

    saveEvents();
    closeModal();
});

document.getElementById("prev-month").addEventListener("click", () => {
    currentDate.setMonth(currentDate.getMonth() - 1);
    displayCalendar();
});

document.getElementById("next-month").addEventListener("click", () => {
    currentDate.setMonth(currentDate.getMonth() + 1);
    displayCalendar();
});

document.getElementById("close-modal").addEventListener("click", closeModal);

modal.addEventListener("click", (e) => {
    if (e.target === modal) closeModal();
});

displayCalendar();
</script>

</body>
</html>
