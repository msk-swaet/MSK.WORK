
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | MSK.WORK</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #100d14;
            color: white;
            font-family: "Trebuchet MS", sans-serif;
        }

        .auth-container {
            width: 100%;
            max-width: 430px;
            padding: 38px;
            background: #19151f;
            border: 1px solid #38283f;
            border-radius: 18px;
            box-shadow: 0 15px 45px #0005;
        }

        .logo {
            text-align: center;
            font-size: 27px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .logo span {
            color: #e32652;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 28px;
            font-size: 14px;
        }

        .auth-tabs {
            display: flex;
            background: #241d2b;
            padding: 5px;
            border-radius: 9px;
            margin-bottom: 25px;
        }

        .auth-tabs button {
            flex: 1;
            padding: 11px;
            border: none;
            border-radius: 7px;
            background: transparent;
            color: #aaa;
            cursor: pointer;
            font-weight: bold;
        }

        .auth-tabs button.active {
            background: linear-gradient(90deg, #e32652, #9146cc);
            color: white;
        }

        label {
            display: block;
            margin: 16px 0 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            background: #241d2b;
            border: 1px solid #45344f;
            border-radius: 8px;
            color: white;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #9146cc;
        }

        .main-button {
            width: 100%;
            padding: 14px;
            margin-top: 23px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(90deg, #e32652, #9146cc);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .main-button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .separator {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #777;
            margin: 23px 0;
            font-size: 13px;
        }

        .separator::before,
        .separator::after {
            content: "";
            height: 1px;
            flex: 1;
            background: #403548;
        }

        .google-button {
            width: 100%;
            padding: 13px;
            background: #fff;
            color: #222;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .google-button:hover {
            background: #eee;
        }

        #message {
            margin-top: 18px;
            font-size: 13px;
            text-align: center;
            line-height: 1.5;
            color: #d7b8ef;
        }

        .back-link {
            display: block;
            margin-top: 25px;
            text-align: center;
            color: #aaa;
            text-decoration: none;
            font-size: 13px;
        }

        .back-link:hover {
            color: white;
        }

        @media(max-width: 480px) {
            .auth-container {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

<div class="auth-container">

    <div class="logo">MSK<span>.</span>WORK</div>

    <h1 id="form-title">Bienvenue !</h1>
    <p class="subtitle" id="form-subtitle">
        Connecte-toi à ton espace personnel.
    </p>

    <div class="auth-tabs">
        <button id="login-tab" class="active" type="button">
            Connexion
        </button>

        <button id="signup-tab" type="button">
            Inscription
        </button>
    </div>

    <form id="auth-form">

        <label for="email">Adresse e-mail</label>
        <input
            type="email"
            id="email"
            placeholder="exemple@email.com"
            autocomplete="email"
            required
        >

        <label for="password">Mot de passe</label>
        <input
            type="password"
            id="password"
            placeholder="Ton mot de passe"
            autocomplete="current-password"
            minlength="6"
            required
        >

        <button type="submit" class="main-button" id="submit-button">
            Se connecter
        </button>

    </form>

    <div class="separator">OU</div>

    <button type="button" class="google-button" id="google-button">
        Continuer avec Google
    </button>

    <p id="message" role="status" aria-live="polite"></p>

    <a href="index.html" class="back-link">
        ← Retour à l'accueil
    </a>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    // REMPLACE CES DEUX VALEURS PAR TES INFORMATIONS SUPABASE

    const SUPABASE_URL = "https://gfromvjcbcynhaozixvv.supabase.co";
    const SUPABASE_KEY = "sb_publishable_SBeIjDsF-NGBZW6pHVEkfA_21L7Zue1";

    const client = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );
    client.auth.onAuthStateChange((event, session) => {
    console.log("État de connexion :", event);
    console.log("Session active :", !!session);
});

    let mode = "login";

    const form = document.getElementById("auth-form");
    const loginTab = document.getElementById("login-tab");
    const signupTab = document.getElementById("signup-tab");
    const submitButton = document.getElementById("submit-button");
    const message = document.getElementById("message");

    function changeMode(newMode) {
        mode = newMode;

        loginTab.classList.toggle("active", mode === "login");
        signupTab.classList.toggle("active", mode === "signup");

        document.getElementById("form-title").textContent =
            mode === "login" ? "Bienvenue !" : "Créer un compte";

        document.getElementById("form-subtitle").textContent =
            mode === "login"
            ? "Connecte-toi à ton espace personnel."
            : "Rejoins ton espace de travail.";

        submitButton.textContent =
            mode === "login" ? "Se connecter" : "Créer mon compte";

        document.getElementById("password").autocomplete =
            mode === "login" ? "current-password" : "new-password";

        message.textContent = "";
    }

    loginTab.addEventListener("click", () => changeMode("login"));
    signupTab.addEventListener("click", () => changeMode("signup"));

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        submitButton.disabled = true;
        message.textContent = "Patiente un instant...";

        try {
            if (mode === "signup") {
                const { data, error } = await client.auth.signUp({
                    email,
                    password,
                    options: {
                        emailRedirectTo:
                            window.location.origin + "/MSK.WORK/connexion.html"
                    }
                });

                if (error) throw error;

                if (data.session) {
                    message.textContent = "Compte créé ! Redirection...";
                    window.location.href = "index.html";
                } else {
                    message.textContent =
                        "Compte créé ! Vérifie ta boîte mail pour confirmer ton adresse.";
                }

            } else {
                const { error } = await client.auth.signInWithPassword({
                    email,
                    password
                });

                if (error) throw error;

                message.textContent = "Connexion réussie !";
                window.location.href = "index.html";
            }

        } catch (error) {
            message.textContent = error.message;
        } finally {
            submitButton.disabled = false;
        }
    });

    document.getElementById("google-button").addEventListener(
        "click",
        async () => {
            message.textContent = "Connexion avec Google...";

            const { error } = await client.auth.signInWithOAuth({
                provider: "google",
                options: {
                    redirectTo:
                        window.location.origin + "/MSK.WORK/"
                }
            });

            if (error) {
                message.textContent = error.message;
            }
        }
    );
</script>

</body>
</html>
